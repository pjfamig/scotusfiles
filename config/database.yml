# PostgreSQL in every environment, matching Heroku Postgres in production.
# Solid Cache, Solid Queue, and Solid Cable keep their tables in this same database.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: scotusfiles_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: scotusfiles_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  # Puma threads plus the Solid Queue supervisor's workers, dispatcher, and scheduler share one pool.
  max_connections: <%= ENV.fetch("DB_POOL") { 12 } %>
